---
# yamllint disable rule:line-length
# Checks the Android manifest inside the Quest APK that the Builds workflow produced. The manifest that
# ships is merged by Gradle from every package's, so this reads the real one with aapt2 instead of
# trusting the project's source files. No headset or Unity needed.
#
# A workflow_run workflow always runs the version on the default branch, so this starts working once it
# is merged; before that, run it by hand from a branch that has it, giving the run id of a Builds run.
name: telewheel-quest-inspect

on:  # yamllint disable-line rule:truthy
  workflow_run:
    workflows: [Builds]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: The id of the Builds run whose Quest build to inspect
        required: true

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    # A cancelled run has no finished build to look at.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the Android Meta Quest build
        uses: actions/download-artifact@v8
        continue-on-error: true  # The Quest row may have failed, and that is reported by the Builds run itself
        with:
          pattern: Android Meta Quest*
          merge-multiple: true
          path: quest
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      - name: Read the manifest and check it
        run: |
          APK=$(find quest -name '*.apk' 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then
            echo "::notice::No Quest APK in run $RUN_ID, so there is nothing to inspect."
            exit 0
          fi
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          echo "Inspecting $APK with $AAPT2"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifest-dump.txt
          python3 -I Support/Python/telewheel_check_manifest.py manifest-dump.txt | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          {
            echo
            echo "<details><summary>The full manifest</summary>"
            echo
            echo '```'
            cat manifest-dump.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
